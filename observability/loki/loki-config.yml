# Single-binary Loki, filesystem storage. Sized for local development and a
# single bot host — not for a production cluster.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # The bot pushes with wall-clock timestamps; allow modest clock skew.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  # Structured metadata is unused (call_id travels inside the JSON line so that
  # label cardinality stays flat), but leaving it on costs nothing.
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h

analytics:
  reporting_enabled: false
